{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
    <h1>Connexion</h1>

    {% if success %}
        <div class="alert alert-success">
            Connexion réussie !
        </div>

        <a href="/" class="btn btn-success">Retour à l'accueil</a>
        <br><br>
    {% endif %}

    {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        <div class="mb-3">
            <label for="email" class="form-label">Email :</label>
            <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                required
            >
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Mot de passe :</label>
            <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary">
            Se connecter
        </button>
    </form>
{% endblock %}
